name: Feature request
description: Suggest a Solstake improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For protocol integrations, include official program or documentation references.
    validations:
      required: true
