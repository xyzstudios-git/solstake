name: Bug report
description: Report a reproducible problem in Solfund.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include seed phrases, private keys, API keys, or private wallet exports. Report security vulnerabilities using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Explain the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, and wallet extension name/version.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Sanitized errors or screenshots, if helpful.
